[project]
name = "proposal-ai-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "arq==0.28.0",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "boto3>=1.43.53",
    "email-validator==2.3.0",
    "fastapi==0.138.0",
    "jinja2>=3.1.6",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.9",
    "minio==7.2.20",
    "openai==2.45.0",
    "opencv-contrib-python==4.10.0.84",
    "paddleocr==3.7.0",
    "paddlepaddle==3.2.2",
    "paddlex[ocr]==3.7.2",
    "passlib==1.7.4",
    "pinecone==9.1.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pymupdf==1.28.0",
    "pypandoc==1.16",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.51",
    "tiktoken==0.13.0",
    "uvicorn==0.49.0",
    "weasyprint==63.1",
]

[dependency-groups]
dev = [
    "aiosqlite==0.21.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.3.0",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (safe syntax modernization for py312)
    "B",   # flake8-bugbear (likely-bug patterns)
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by the formatter; residual long lines
             # (strings/URLs/comments) aren't safely auto-fixable anyway
    "RUF001", # this codebase intentionally uses typographic en/em dashes in
    "RUF002", # user-facing proposal prose and comments; not a bug to fix
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Standard Alembic scaffold: `from database.models import *` populates
# Base.metadata for autogenerate — enumerating every model explicitly would
# be a bigger, riskier change than the pattern it's flagging.
"alembic/env.py" = ["F403", "F405"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern relies on calling Depends()/Query()/etc. as a default
# value; without this, B008 flags every route handler in the project.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
    "authentication.dependency.require_role",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["test"]
# The tests import app modules (main, router.*, database.*) by their top-level
# names, so the repo root has to be importable. pytest only puts the *test*
# directory on sys.path by default.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
filterwarnings = [
    # SQLAlchemy/passlib/paddle pull in a lot of third-party deprecation noise
    # that has nothing to do with this codebase.
    "ignore::DeprecationWarning",
]
