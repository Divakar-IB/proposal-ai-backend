<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposal Template</title>
    <style>
        /* ==========================================================================
           1. CORE & RESET STYLES
           ========================================================================== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 10.5pt;
            line-height: 1.6;
            color: #2D3748;
            background-color: #F7FAFC;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .document-container {
            max-width: 800px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 50px 60px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        /* ==========================================================================
           2. TYPOGRAPHY & HEADINGS
           ========================================================================== */
        h1, h2, h3, h4 {
            color: #1A365D;
            font-weight: 700;
            line-height: 1.25;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            page-break-after: avoid;
        }

        h1 {
            font-size: 18pt;
            border-bottom: 2px solid #3182CE;
            padding-bottom: 6px;
            margin-top: 2em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 13.5pt;
            color: #2B6CB0;
            margin-top: 1.2em;
        }

        h3 {
            font-size: 11pt;
            color: #2D3748;
        }

        p {
            margin-bottom: 1em;
            text-align: justify;
        }

        strong {
            color: #1A202C;
            font-weight: 600;
        }

        /* ==========================================================================
           3. COVER / HEADER BLOCK
           ========================================================================== */
        .header-container {
            border-bottom: 3px solid #1A365D;
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .company-branding {
            font-size: 22pt;
            font-weight: 800;
            color: #1A365D;
            letter-spacing: -0.5px;
        }

        .company-sub {
            font-size: 9pt;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-contact {
            text-align: right;
            font-size: 8.5pt;
            color: #718096;
        }

        .document-title-block {
            background-color: #EBF8FF;
            border-left: 5px solid #3182CE;
            padding: 20px;
            margin: 20px 0 25px 0;
            border-radius: 0 4px 4px 0;
        }

        .document-title-block h0 {
            display: block;
            font-size: 18pt;
            font-weight: 700;
            color: #2B6CB0;
            margin-bottom: 5px;
        }

        .document-subtitle {
            font-size: 11pt;
            color: #4A5568;
        }

        /* Metadata Grid Table */
        .meta-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            font-size: 9.5pt;
        }

        .meta-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #E2E8F0;
        }

        .meta-table tr td:first-child {
            font-weight: 600;
            color: #4A5568;
            width: 30%;
            background-color: #F7FAFC;
        }

        /* ==========================================================================
           4. LISTS & CALLOUT BOXES
           ========================================================================== */
        ul, ol {
            margin-bottom: 1em;
            padding-left: 20px;
        }

        li {
            margin-bottom: 0.4em;
        }

        .callout-box {
            background-color: #EDF2F7;
            border-left: 4px solid #4A5568;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 4px 4px 0;
            font-size: 9.5pt;
        }

        .callout-box.confidential {
            background-color: #FFF5F5;
            border-left-color: #E53E3E;
            color: #9B2C2C;
        }

        .callout-box.highlight {
            background-color: #FEFCBF;
            border-left-color: #D69E2E;
            color: #744210;
        }

        /* ==========================================================================
           5. DATA TABLES
           ========================================================================== */
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 9pt;
            page-break-inside: auto;
        }

        table.data-table tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        table.data-table th {
            background-color: #2B6CB0;
            color: #FFFFFF;
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
            border: 1px solid #2B6CB0;
        }

        table.data-table td {
            padding: 9px 12px;
            border: 1px solid #E2E8F0;
            vertical-align: top;
        }

        table.data-table tbody tr:nth-child(even) {
            background-color: #F7FAFC;
        }

        /* ==========================================================================
           6. PRINT PREPARATION & PAGE BREAKS
           ========================================================================== */
        .page-break {
            page-break-before: always;
            break-before: page;
        }

        .footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #E2E8F0;
            font-size: 8pt;
            color: #A0AEC0;
            display: flex;
            justify-content: space-between;
        }

        @media print {
            body {
                background: none;
            }
            .document-container {
                padding: 0;
                box-shadow: none;
                max-width: 100%;
            }
            @page {
                size: A4;
                margin: 20mm 15mm 20mm 15mm;
            }
        }
    </style>
</head>
<body>

<div class="document-container">

    <!-- Title Block -->
    <div class="document-title-block">
        <h0>{{ proposal_title }}</h0>
    </div>

    <!-- Sections — each rendered from the proposal's stored Markdown,
         pre-converted to HTML by rendering/html_renderer.py -->
    {% for section in sections %}
    <h1>{{ section.title }}</h1>
    {{ section.content_html | safe }}
    {% endfor %}

    <!-- Footer Block -->
    <div class="footer">
        <span>Confidential</span>
        <span>{{ proposal_title }}</span>
    </div>

</div>

</body>
</html>
